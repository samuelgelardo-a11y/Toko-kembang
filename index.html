    <?php
    // Mengecek apakah tombol 'submit' (dengan name="hitung") sudah ditekan
    if(isset($_POST['hitung'])) {
        
        // Mengambil data dari form
        $nilai1 = $_POST['nilai1'];
        $nilai2 = $_POST['nilai2'];
        $operator = $_POST['operator'];
        $hasil = 0;

        // Melakukan perhitungan berdasarkan operator yang dipilih
        switch ($operator) {
            case '+':
                $hasil = $nilai1 + $nilai2;
                break;
            case '-':
                $hasil = $nilai1 - $nilai2;
                break;
            case '*':
                $hasil = $nilai1 * $nilai2;
                break;
            case '/':
                // Mencegah error jika angka dibagi dengan 0
                if ($nilai2 != 0) {
                    $hasil = $nilai1 / $nilai2;
                } else {
                    $hasil = "Error (Tidak bisa dibagi 0)";
                }
                break;
        }

        // Menampilkan Hasil di bawah form
        echo "<hr style='width: 50%;'>";
        echo "<h3>Hasil Perhitungan:</h3>";
        echo "<p style='font-size: 18pt;'>$nilai1 $operator $nilai2 = <b>$hasil</b></p>";
    }
    ?>
