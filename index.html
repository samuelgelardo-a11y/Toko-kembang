<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/b67e368fa6.js" crossorigin="anonymous"></script>
    <title>Warteg Bemo</title>
    
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap");

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box; /* Ditambahkan agar padding tidak merusak lebar elemen */
          font-family: "Poppins", sans-serif;
        }
        body {
          background-color: #e3e9ff;
        }
        .navbar {
          width: 100%;
          height: 75px;
          display: flex;
          align-items: center;
          background-color: white;
          -webkit-box-shadow: 3px 10px 25px -19px rgba(0, 0, 0, 0.75);
          -moz-box-shadow: 3px 10px 25px -19px rgba(0, 0, 0, 0.75);
          box-shadow: 3px 10px 25px -19px rgba(0, 0, 0, 0.75);
        }
        .navbar ul {
          list-style: none;
          margin: 20px;
          background-color: white;
        }
        .navbar ul li {
          display: inline;
          font-size: 20px;
          font-weight: 500;
          padding-right: 20px;
        }
        .navbar ul li a {
          text-decoration: none;
          color: #122363;
        }
        .navbar ul li a:hover {
          color: rgb(247, 143, 7);
        }
        .navbar img {
          width: 70px;
          height: 70px;
          padding: 5px 0px 5px 35px;
        }
        .main {
          position: relative;
          justify-content: center;
          display: flex;
          overflow: visible; /* Diubah agar bisa di-scroll di HP */
        }
        .content {
          width: 70%;
          padding: 15px;
          display: flex;
          flex-wrap: wrap; /* Agar card bisa turun ke baris baru */
          justify-content: flex-start;
        }

        .sidebar {
          background-color: #122363;
          width: 30%;
          min-height: 90vh;
          padding: 17px 10px 10px 10px;
          flex-direction: column;
          display: none;
        }

        .card-order {
          width: 100%;
          height: max-content;
          margin: 10px 0;
          background-color: white;
          display: flex;
          align-items: center;
          border-radius: 10px;
          padding: 5px;
          box-shadow: 9px 9px 18px -13px rgba(0, 0, 0, 0.75);
        }

        .card-order img {
          width: 50px;
          border-radius: 10px;
          margin: 5px;
        }

        .card-order p {
          padding: 5px;
          font-size: 15px;
          width: 50%;
          font-weight: 500;
          color: #4e4e4e;
        }

        .card-order span {
          padding: 5px;
          font-size: 15px;
          font-weight: 500;
          color: #4e4e4e;
        }

        .card-order button {
          background-color: rgb(214, 11, 11);
          border-radius: 10px;
          padding: 5px 10px;
          margin-left: auto;
          border: none;
          color: whitesmoke;
          font-weight: 500;
          cursor: pointer;
        }

        .card {
          width: 280px;
          height: max-content;
          background-color: white;
          border-radius: 10px;
          margin: 10px;
          display: inline-block;
          box-shadow: 9px 9px 18px -13px rgba(0, 0, 0, 0.75);
        }

        .card img {
          width: 100%;
          height: 200px;
          object-fit: cover; /* Agar gambar tidak gepeng */
          border-top-left-radius: 10px;
          border-top-right-radius: 10px;
        }

        .card p {
          margin: 10px;
          font-size: 18px;
          color: #4e4e4e;
          font-weight: 700;
        }

        .action {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0px 10px 15px 10px;
        }

        .action span {
          font-size: 14px;
          font-weight: 600;
        }

        .card-finish button {
          border: none;
          width: 100%;
          height: 50px;
          margin-top: 15px;
          background-color: rgb(247, 143, 7);
          border-radius: 10px;
          font-size: 18px;
          font-weight: 600;
          color: white;
          cursor: pointer;
        }

        .action button {
          background-color: #00b91f;
          border-radius: 10px;
          border: none;
          color: white;
          padding: 8px 12px;
          cursor: pointer;
        }

        .total h1 {
          color: white;
          font-size: 20px;
          margin-bottom: 10px;
        }

        .detail {
          width: 100%;
          display: flex;
          align-items: center;
        }

        /* ========================================= */
        /* MEDIA QUERIES UNTUK TAMPILAN HP (MOBILE)  */
        /* ========================================= */
        @media screen and (max-width: 768px) {
            .navbar {
                height: auto;
                flex-direction: column;
                padding: 10px 0;
            }
            .navbar img {
                padding: 0;
                margin-bottom: 10px;
            }
            .navbar ul {
                margin: 0;
                text-align: center;
            }
            .navbar ul li {
                display: inline-block;
                padding: 5px 10px;
                font-size: 16px;
            }
            .main {
                flex-direction: column; /* Mengubah layout jadi atas-bawah */
            }
            .content {
                width: 100%; /* Lebar menu makanan jadi 100% */
                justify-content: center;
            }
            .sidebar {
                width: 100%; /* Lebar keranjang jadi 100% */
                height: auto;
                padding-bottom: 30px;
            }
            .card {
                width: 45%; /* Di HP agak besar, tampil 2 kolom */
                margin: 2%;
            }
            .action {
                flex-direction: column;
                gap: 10px;
            }
            .action button {
                width: 100%;
            }
        }

        @media screen and (max-width: 480px) {
            .card {
                width: 90%; /* Di HP sangat kecil, tampil 1 kolom */
                margin: 5%;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="./assets/images/logo warteg bemo.png" alt="Logo">
        <ul>
            <li><a href="./index.html">Daftar Makanan</a></li>
            <li><a href="./tentang-kami.html">Tentang Kami</a></li>
        </ul>
    </div>
    <div class="main">
        <div class="content" id='foodList'></div>
        <div class="sidebar" id="cartList"></div>
    </div>

    <script>
        let totalHargaMakanan = 0;
        let food = [
            { name:`Rawon`, stok: 2, harga: 20000, image: './assets/images/rawon.jpg' },
            { name:`Soto Betawi`, stok: 0, harga: 60000, image: './assets/images/sotobetawi.jpg' },
            { name:`Krupuk`, stok: 12, harga: 2500, image: './assets/images/kerupuk_putih.jpg' },
            { name:`Telur Asin`, stok: 20, harga: 70000, image: './assets/images/telor_asin.jpg' },
            { name:`Es Teh Manis`, stok: 25, harga: 20000, image: './assets/images/es_teh_manis.jpg' },
        ]

        let cart = [];
        let pembelian = [];

        function checkAvailable(){
            var available = true;
            for(var i = 0; i<cart.length; i++){
                for(var j = 0; j<food.length; j++){
                    if(cart[i].name === food[j].name){
                        if(food[j].stok < cart[i].jumlah){
                            available = false;
                            alert(`Stok ${food[j].name} tinggal ${food[j].stok}`);
                            break;
                        }
                    }  
                }
                if(!available) break;
            }
            return available
        }

        function orderFood(){
            if(checkAvailable()){
                for(var x = 0; x<cart.length; x++){
                    for(var y = 0; y<food.length; y++){
                        if(cart[x].name === food[y].name){  
                                food[y].stok -= cart[x].jumlah;
                        }
                    }
                }
                var cartList = document.getElementById('cartList');
                cartList.style.display = 'none';
                alert(`Pesanan telah diterima. Total Harga : Rp${toRupiah(totalHargaMakanan)},00`);
                cart.push(totalHargaMakanan);
                pembelian.push(cart);
                totalHargaMakanan = 0;
                cart = [];
                generateData();    
            }
        }

        function addtoCart(index) {
            var hasExist = false;
            var hasEmpty = false;
            if(food[index].stok <= 0){
                alert(`${food[index].name} habis, silahkan pesan menu lainnya`);
                hasEmpty = true;
            }
            for(var i = 0; i<cart.length; i++){
                if(food[index].name === cart[i].name){
                    if(food[index].stok - cart[i].jumlah <=0){
                        alert(`${food[index].name} habis, silahkan pesan menu lainnya`);
                        hasEmpty = true;
                        break;
                    }else{
                        totalHargaMakanan += cart[i].harga;
                        cart[i].jumlah ++;
                        hasExist = true;
                        break;
                    }      
                }
            }
            if(!hasExist && !hasEmpty){
                let obj ={
                    name: food[index].name,
                    harga: food[index].harga,
                    jumlah: 1,
                    image: food[index].image,
                }
                totalHargaMakanan +=food[index].harga;
                cart.push(obj);
            }
            generateData();
            var cartlist = document.getElementById('cartList');
            if(cart.length !== 0){
                cartlist.style.display = 'flex';
            }
        }

        function removeFood(value){
            if(cart[value].jumlah > 0){
                totalHargaMakanan -=cart[value].harga;
                cart[value].jumlah--;
            }   
            if(cart[value].jumlah === 0){
                cart.splice(value,1);
            }
            generateData();
            var cartlist = document.getElementById('cartList');
            if(cart.length !== 0){
                cartlist.style.display = 'flex';
            }else{
                cartlist.style.display = 'none';
            }
        }

        function toRupiah(harga){
            var result = '';
            harga = String(harga);
            var arr = [];
            var count = 0;
            for(var i = harga.length-1; i>=0; i--){
                if(count === 3 && harga[i] !=undefined){
                    arr.push('.');
                    arr.push(harga[i]);
                    count = 1;
                }else{
                    arr.push(harga[i]);
                    count++;
                }
            }
            for(var i = arr.length-1; i>=0; i--){
                result += arr[i];
            }
            return result;
        }

        function generateData(){
            const foodList = document.getElementById('foodList');
            const cartList = document.getElementById('cartList');
            foodList.innerHTML = '';
            cartList.innerHTML = '';
            
            for(var i =0; i<food.length; i++){
                let name = food[i].name;
                let stok = food[i].stok;
                let harga = food[i].harga;
                let image = food[i].image;
              
                let divCard = document.createElement('div');
                divCard.classList.add('card')

                let imageData = document.createElement('img')
                imageData.setAttribute("src",image);
                divCard.appendChild(imageData);
            
                let title = document.createElement('p');
                title.innerHTML = name;
                divCard.appendChild(title);

                let divAction = document.createElement('div');
                divAction.classList.add('action');

                let spanData = document.createElement('span');
                spanData.innerHTML = `Rp ${toRupiah(harga)} | Stok: ${stok}`;
                divAction.appendChild(spanData);

                let buttonAdd = document.createElement('button');
                buttonAdd.innerHTML = '<i class="fas fa-cart-plus"></i> Pesan';
                buttonAdd.setAttribute('value', i);
                buttonAdd.setAttribute('onclick', 'addtoCart(this.value)');
                divAction.appendChild(buttonAdd);
                divCard.appendChild(divAction);
                foodList.appendChild(divCard);
            }

            let totalDiv = document.createElement('div');
            totalDiv.classList.add('total');

            let totalh1 = document.createElement('h1');
            totalh1.innerHTML = `TOTAL : Rp${toRupiah(totalHargaMakanan)}`;
            totalDiv.appendChild(totalh1);

            let totalhr = document.createElement('hr');
            totalDiv.appendChild(totalhr);
            cartList.appendChild(totalDiv);

            for(var x =0; x<cart.length; x++){
                let name = cart[x].name;
                let jumlah = cart[x].jumlah;
                let image = cart[x].image;
                
                let divCardx = document.createElement('div');
                divCardx.classList.add('card-order');  

                let divCardDetail = document.createElement('div');
                divCardDetail.classList.add('detail');

                let imageData = document.createElement('img')
                imageData.setAttribute("src",image);
                divCardDetail.appendChild(imageData);
                
                let foodName = document.createElement('p');
                foodName.innerHTML = name;
                divCardDetail.appendChild(foodName);

                let foodJumlah = document.createElement('span');
                foodJumlah.innerHTML = "x" + jumlah;
                divCardDetail.appendChild(foodJumlah);
                
                divCardx.appendChild(divCardDetail);

                let buttonCancel = document.createElement('button');
                buttonCancel.setAttribute('value', x );
                buttonCancel.setAttribute('onclick', 'removeFood(this.value)');
                buttonCancel.innerHTML = '<i class="fas fa-trash"></i>';
                divCardx.appendChild(buttonCancel);
            
                cartList.appendChild(divCardx);
            }

            let divbutton = document.createElement('div');
            divbutton.classList.add("card-finish");

            let buttonOrder = document.createElement('button');
            buttonOrder.setAttribute('onclick', 'orderFood()');
            buttonOrder.innerHTML = 'ORDER SEKARANG';
            divbutton.appendChild(buttonOrder);
            cartList.appendChild(divbutton);
        }
        generateData()
    </script>
</body>
</html>
