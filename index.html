<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jual Petasan - Admin HP</title>
    <style>
        /* TAMPILAN (Sama seperti sebelumnya) */
        :root { --merah: #d32f2f; --hitam: #212121; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; padding-bottom: 60px; }
        nav { background: var(--hitam); color: white; padding: 15px; display: flex; justify-content: space-between; position: sticky; top:0; z-index:99; }
        
        .container { max-width: 800px; margin: auto; padding: 10px; }
        
        /* Kartu Produk */
        .card { background: white; margin-bottom: 15px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #ddd; }
        .card-body { padding: 15px; }
        .judul { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .harga { color: var(--merah); font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .desc { font-size: 0.9rem; color: #555; margin-bottom: 15px; }
        
        /* Tombol */
        .btn { border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-beli { background: #25D366; color: white; text-decoration: none; display: block; text-align: center; }
        .btn-login { background: #ffc107; width: auto; font-size: 0.8rem; }
        .btn-admin { background: var(--hitam); color: white; }
        
        /* Admin Tools */
        .admin-tools { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn-edit { background: #2196F3; color: white; flex: 1; }
        .btn-hapus { background: var(--merah); color: white; flex: 1; }
        
        /* Form Input */
        #formPanel { display: none; background: white; padding: 20px; border-top: 5px solid var(--merah); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <nav>
        <h3>💥 Petasan Online</h3>
        <button class="btn btn-login" id="loginBtn" onclick="toggleLogin()">Login Admin</button>
    </nav>

    <div class="container">
        
        <div id="formPanel">
            <h3 id="formTitle">Tambah Produk</h3>
            <input type="hidden" id="pId"> <label>Nama Produk</label>
            <input type="text" id="pNama">
            
            <label>Link Foto (URL)</label>
            <input type="text" id="pImg" placeholder="https://...">
            
            <label>Deskripsi</label>
            <textarea id="pDesc" rows="3"></textarea>
            
            <label>Harga (Rp)</label>
            <input type="number" id="pHarga">
            
            <button class="btn btn-admin" onclick="simpanKeSheetDB()">SIMPAN DATA</button>
            <button class="btn" onclick="resetForm()" style="background:#ddd;">BATAL</button>
        </div>

        <p id="status" style="text-align:center; color:grey;">Memuat data...</p>
        <div id="listProduk"></div>
    </div>

    <script>
        // ============================================
        // PASTE LINK SHEETDB ANDA DI BAWAH INI:
        // ============================================
        const API_URL = "LINK_SHEETDB_ANDA_DISINI"; 

        let isAdmin = false;

        // 1. BACA DATA (GET)
        function loadData() {
            document.getElementById('status').innerText = "Sedang mengambil data...";
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    render(data);
                    document.getElementById('status').innerText = "";
                })
                .catch(err => document.getElementById('status').innerText = "Gagal koneksi.");
        }

        // 2. TAMPILKAN KE LAYAR
        function render(data) {
            const list = document.getElementById('listProduk');
            list.innerHTML = '';
            
            data.forEach(p => {
                let adminHtml = '';
                if(isAdmin){
                    adminHtml = `
                    <div class="admin-tools">
                        <button class="btn btn-edit" onclick="editMode('${p.id}', '${p.nama}', '${p.gambar}', '${p.desc}', '${p.harga}')">Edit</button>
                        <button class="btn btn-hapus" onclick="hapusData('${p.id}')">Hapus</button>
                    </div>`;
                }

                const rupiah = Number(p.harga).toLocaleString('id-ID');

                list.innerHTML += `
                <div class="card">
                    <img src="${p.gambar}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                    <div class="card-body">
                        <div class="judul">${p.nama}</div>
                        <div class="desc">${p.desc}</div>
                        <div class="harga">Rp ${rupiah}</div>
                        ${adminHtml}
                        <a href="https://wa.me/628123456789?text=Order ${p.nama}" class="btn btn-beli">Beli via WA</a>
                    </div>
                </div>`;
            });
        }

        // 3. SIMPAN DATA (POST / PUT)
        function simpanKeSheetDB() {
            const id = document.getElementById('pId').value;
            const nama = document.getElementById('pNama').value;
            const img = document.getElementById('pImg').value;
            const desc = document.getElementById('pDesc').value;
            const harga = document.getElementById('pHarga').value;

            if(!nama || !harga) return alert("Isi Nama dan Harga!");

            document.getElementById('status').innerText = "Menyimpan...";
            
            const dataKirim = {
                data: { // Format wajib SheetDB
                    nama: nama,
                    gambar: img,
                    desc: desc,
                    harga: harga
                }
            };

            if(id) {
                // --- UPDATE (EDIT) ---
                // Menggunakan endpoint /id/{value}
                fetch(`${API_URL}/id/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataKirim)
                }).then(() => {
                    resetForm();
                    loadData();
                });
            } else {
                // --- CREATE (BARU) ---
                // Generate ID unik pakai waktu sekarang
                dataKirim.data.id = Date.now(); 
                
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataKirim)
                }).then(() => {
                    resetForm();
                    loadData();
                });
            }
        }

        // 4. HAPUS DATA (DELETE)
        function hapusData(id) {
            if(confirm("Hapus produk ini?")) {
                document.getElementById('status').innerText = "Menghapus...";
                fetch(`${API_URL}/id/${id}`, {
                    method: 'DELETE'
                }).then(() => loadData());
            }
        }

        // --- UI & LOGIN ---
        function toggleLogin() {
            if(!isAdmin) {
                const pass = prompt("Password Admin:");
                if(pass === "admin123") {
                    isAdmin = true;
                    document.getElementById('loginBtn').innerText = "Logout";
                    document.getElementById('loginBtn').style.background = "#d32f2f";
                    document.getElementById('loginBtn').style.color = "white";
                    document.getElementById('formPanel').style.display = "block";
                    loadData(); // Reload biar tombol muncul
                }
            } else {
                isAdmin = false;
                document.getElementById('loginBtn').innerText = "Login Admin";
                document.getElementById('loginBtn').style.background = "#ffc107";
                document.getElementById('loginBtn').style.color = "black";
                document.getElementById('formPanel').style.display = "none";
                loadData();
            }
        }

        function editMode(id, nama, img, desc, harga) {
            document.getElementById('pId').value = id;
            document.getElementById('pNama').value = nama;
            document.getElementById('pImg').value = img;
            document.getElementById('pDesc').value = desc;
            document.getElementById('pHarga').value = harga;
            document.getElementById('formTitle').innerText = "Edit Produk";
            document.getElementById('formPanel').style.display = 'block';
            window.scrollTo(0,0);
        }

        function resetForm() {
            document.getElementById('pId').value = '';
            document.getElementById('pNama').value = '';
            document.getElementById('pImg').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('pHarga').value = '';
            document.getElementById('formTitle').innerText = "Tambah Produk";
        }

        // Jalankan awal
        loadData();
    </script>
</body>
</html>
