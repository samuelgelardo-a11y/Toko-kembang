<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Petasan Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
header{padding:20px;text-align:center;font-size:22px;font-weight:bold;background:#020617}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:15px}
.card{background:#020617;border-radius:15px;overflow:hidden}
.card img{width:100%;height:140px;object-fit:cover}
.card div{padding:10px}
.price{color:#22c55e;font-weight:bold}
button{padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.wa{background:#22c55e;width:100%;margin-top:8px}
.admin{background:#2563eb;width:100%;margin-top:5px}
#adminPanel{display:none;padding:15px}
input{width:100%;padding:10px;border-radius:8px;border:none;margin-bottom:10px}
</style>
</head>
<body>

<header>🔥 PETASAN STORE 🔥</header>

<div id="adminPanel">
  <h3>Tambah Produk</h3>
  <input id="name" placeholder="Nama Produk">
  <input id="price" placeholder="Harga">
  <input type="file" id="img">
  <button class="admin" onclick="addProduct()">SIMPAN PRODUK</button>
</div>

<div class="grid" id="list"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBTuwZPN__T7EUNiWpzwEe8Pngh_D-TrUw",
  authDomain: "petasan-store.firebaseapp.com",
  projectId: "petasan-store",
  storageBucket: "petasan-store.firebasestorage.app",
  messagingSenderId: "645579788794",
  appId: "1:645579788794:web:67be3621646fdc61ea9443",
  measurementId: "G-VK8JMWXM2Q"
};
firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const storage = firebase.storage();

/* ================= ADMIN LOGIN ================= */
const pass = prompt("Masukkan Password Admin:");
if(pass==="petasan123"){
  document.getElementById("adminPanel").style.display="block";
}

/* ================= LOAD PRODUK ================= */
function load(){
  db.collection("produk").onSnapshot(snap=>{
    list.innerHTML="";
    snap.forEach(doc=>{
      const p=doc.data();
      list.innerHTML+=`
        <div class="card">
          <img src="${p.img}">
          <div>
            <b>${p.name}</b>
            <div class="price">Rp ${p.price}</div>
            <button class="wa" onclick="wa('${p.name}')">Pesan WA</button>
          </div>
        </div>`;
    })
  })
}
load();

/* ================= TAMBAH PRODUK ================= */
function addProduct(){
  const file=img.files[0];
  const ref=storage.ref("produk/"+Date.now());
  ref.put(file).then(()=>{
    ref.getDownloadURL().then(url=>{
      db.collection("produk").add({
        name:name.value,
        price:price.value,
        img:url
      })
      alert("Produk tersimpan");
    })
  })
}

/* ================= WHATSAPP ================= */
function wa(nama){
  window.open(`https://wa.me/6281234567890?text=Halo saya mau pesan ${nama}`)
}
</script>

</body>
</html>
